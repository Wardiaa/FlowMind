openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: FlowMind business automation workspace API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: dashboard
  - name: agents
  - name: workflows
  - name: projects
  - name: documents
  - name: activity
  - name: approvals
  - name: settings
  - name: command
  - name: storage
  - name: auth
  - name: notifications
  - name: analytics
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get dashboard overview
      responses:
        "200":
          description: Dashboard overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /agents:
    get:
      operationId: listAgents
      tags: [agents]
      summary: List AI agents
      responses:
        "200":
          description: Agent list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Agent"
    post:
      operationId: createAgent
      tags: [agents]
      summary: Create an AI agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentInput"
      responses:
        "201":
          description: Created agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
  /agents/{id}/run:
    post:
      operationId: runAgent
      tags: [agents]
      summary: Run an AI agent with a user prompt
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentRunInput"
      responses:
        "200":
          description: Agent answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRunResponse"
  /agents/{id}/runs:
    get:
      operationId: listAgentRuns
      tags: [agents]
      summary: List recent runs for an agent
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Agent run history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRunList"
  /agents/{id}:
    delete:
      operationId: deleteAgent
      tags: [agents]
      summary: Delete an AI agent and its run history
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Agent deleted
  /workflows:
    get:
      operationId: listWorkflows
      tags: [workflows]
      summary: List automation workflows
      responses:
        "200":
          description: Workflow list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Workflow"
    post:
      operationId: createWorkflow
      tags: [workflows]
      summary: Create a workflow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowInput"
      responses:
        "201":
          description: Created workflow
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
  /workflows/{id}:
    patch:
      operationId: updateWorkflow
      tags: [workflows]
      summary: Update a workflow
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowUpdate"
      responses:
        "200":
          description: Updated workflow
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
    delete:
      operationId: deleteWorkflow
      tags: [workflows]
      summary: Delete a workflow, its executions and pending approvals
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Workflow deleted
  /workflows/{id}/run:
    post:
      operationId: runWorkflow
      tags: [workflows]
      summary: Start a workflow run
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "202":
          description: Workflow execution started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowExecution"
  /workflows/{id}/executions:
    get:
      operationId: listWorkflowExecutions
      tags: [workflows]
      summary: List recent executions for a workflow
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Workflow execution history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowExecutionList"
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List projects
      responses:
        "200":
          description: Project list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
  /projects/{id}/analyze:
    post:
      operationId: analyzeProject
      tags: [projects]
      summary: Generate an AI project analysis
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Project analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisResponse"
  /projects/{id}:
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Project deleted
  /documents:
    get:
      operationId: listDocuments
      tags: [documents]
      summary: List documents
      responses:
        "200":
          description: Document list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Document"
    post:
      operationId: createDocument
      tags: [documents]
      summary: Save uploaded document metadata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentInput"
      responses:
        "201":
          description: Saved document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
  /documents/{id}:
    delete:
      operationId: deleteDocument
      tags: [documents]
      summary: Delete an uploaded document
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Document deleted
  /documents/search:
    post:
      operationId: searchDocuments
      tags: [documents]
      summary: Semantic search over workspace documents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentSearchInput"
      responses:
        "200":
          description: Ranked document passages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentSearchResponse"
  /activity:
    get:
      operationId: listActivity
      tags: [activity]
      summary: List activity events
      responses:
        "200":
          description: Activity list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityEvent"
  /approvals:
    get:
      operationId: listApprovals
      tags: [approvals]
      summary: List approvals
      responses:
        "200":
          description: Approval list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalList"
  /approvals/{id}/decision:
    patch:
      operationId: decideApproval
      tags: [approvals]
      summary: Approve or reject an AI-generated action
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalDecision"
      responses:
        "200":
          description: Updated approval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Approval"
  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List in-app notifications with unread count
      responses:
        "200":
          description: Notifications and unread count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationList"
  /notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      tags: [notifications]
      summary: Mark all notifications as read
      responses:
        "200":
          description: All notifications marked read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationList"
  /notifications/{id}/read:
    post:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark one notification as read
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Updated notification list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationList"
  /analytics/ai-usage:
    get:
      operationId: getAiUsage
      tags: [analytics]
      summary: AI token and latency usage over recent days
      parameters:
        - name: days
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 90
            default: 14
      responses:
        "200":
          description: AI usage report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiUsageReport"
  /settings:
    get:
      operationId: getWorkspaceSettings
      tags: [settings]
      summary: Get workspace settings
      responses:
        "200":
          description: Workspace settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceSettings"
    patch:
      operationId: updateWorkspaceSettings
      tags: [settings]
      summary: Update workspace settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceSettingsUpdate"
      responses:
        "200":
          description: Updated workspace settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceSettings"
  /ai-key:
    get:
      operationId: getWorkspaceAiKey
      tags: [settings]
      summary: Get personal Gemini API key status (masked)
      responses:
        "200":
          description: Personal key status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceAiKeyStatus"
    put:
      operationId: updateWorkspaceAiKey
      tags: [settings]
      summary: Save or replace the personal Gemini API key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceAiKeyInput"
      responses:
        "200":
          description: Personal key status after save
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceAiKeyStatus"
    delete:
      operationId: deleteWorkspaceAiKey
      tags: [settings]
      summary: Remove the personal Gemini API key
      responses:
        "200":
          description: Personal key status after removal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceAiKeyStatus"
  /sample-data:
    post:
      operationId: seedSampleData
      tags: [settings]
      summary: Load the sample workspace content (agents, workflows, projects, documents)
      description: Fills an empty workspace with example content so new users can explore. Does nothing if any agent already exists.
      responses:
        "200":
          description: Sample data result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SampleDataResponse"
  /command:
    post:
      operationId: runCommandCenter
      tags: [command]
      summary: Ask the AI command center a question
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromptInput"
      responses:
        "200":
          description: Command center response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandCenterResponse"
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a private object upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Upload URL generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
  /storage/public-objects/{filePath}:
    get:
      operationId: getPublicObject
      tags: [storage]
      summary: Serve an existing public object
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Public object bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: Object not found
  /auth/user:
    get:
      operationId: getCurrentAuthUser
      tags: [auth]
      summary: Get current authentication state
      responses:
        "200":
          description: Current user or null
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserEnvelope"
  /login:
    get:
      operationId: beginBrowserLogin
      tags: [auth]
      summary: Begin browser sign-in
      parameters:
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
      responses:
        "302":
          description: Redirect to identity provider
  /callback:
    get:
      operationId: handleBrowserLoginCallback
      tags: [auth]
      summary: Complete browser sign-in
      responses:
        "302":
          description: Redirect to app
  /logout:
    get:
      operationId: logoutBrowserSession
      tags: [auth]
      summary: End browser session
      parameters:
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
      responses:
        "302":
          description: Redirect after sign-out
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
    Metric:
      type: object
      required: [label, value, change, trend]
      properties:
        label: { type: string }
        value: { type: string }
        change: { type: string }
        trend: { type: string, enum: [up, neutral, down] }
    Agent:
      type: object
      required: [id, name, type, initials, color, status, runs, description, tools]
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string }
        initials: { type: string }
        color: { type: string }
        status: { type: string, enum: [Active, Paused, Draft] }
        runs: { type: integer }
        description: { type: string }
        tools:
          type: array
          items: { type: string }
    AgentInput:
      type: object
      required: [name, type, description]
      properties:
        name: { type: string, minLength: 1 }
        type: { type: string, minLength: 1 }
        description: { type: string, minLength: 1 }
    Workflow:
      type: object
      required: [id, name, trigger, triggerType, status, runs, success, lastRun, color, steps]
      properties:
        id: { type: string }
        name: { type: string }
        trigger: { type: string }
        triggerType: { type: string, enum: [manual, schedule, webhook] }
        schedule: { type: [string, "null"] }
        webhookToken: { type: [string, "null"] }
        nextRunAt: { type: [string, "null"], format: date-time }
        lastRunAt: { type: [string, "null"], format: date-time }
        status: { type: string, enum: [Active, Draft, Paused] }
        runs: { type: integer }
        success: { type: string }
        lastRun: { type: string }
        color: { type: string }
        steps:
          type: array
          items: { type: string }
    WorkflowInput:
      type: object
      required: [name, trigger]
      properties:
        name: { type: string, minLength: 1 }
        trigger: { type: string, minLength: 1 }
        triggerType: { type: string, enum: [manual, schedule, webhook] }
        schedule: { type: [string, "null"] }
        status: { type: string, enum: [Active, Draft, Paused] }
        steps:
          type: array
          items: { type: string }
    WorkflowUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        trigger: { type: string, minLength: 1 }
        triggerType: { type: string, enum: [manual, schedule, webhook] }
        schedule: { type: [string, "null"] }
        status: { type: string, enum: [Active, Draft, Paused] }
        steps:
          type: array
          items: { type: string }
    ExecutionStep:
      type: object
      required: [name, kind, status]
      properties:
        name: { type: string }
        kind: { type: string, enum: [action, ai, approval] }
        status: { type: string, enum: [pending, running, completed, waiting_approval, approved, rejected, failed] }
        startedAt: { type: [string, "null"], format: date-time }
        finishedAt: { type: [string, "null"], format: date-time }
        output: { type: [string, "null"] }
    WorkflowExecution:
      type: object
      required: [id, workflowId, status, triggerSource, duration, steps, startedAt]
      properties:
        id: { type: string }
        workflowId: { type: string }
        status: { type: string, enum: [Running, Completed, Failed, Waiting] }
        triggerSource: { type: string, enum: [manual, schedule, webhook] }
        duration: { type: string }
        durationMs: { type: [integer, "null"] }
        error: { type: [string, "null"] }
        steps:
          type: array
          items:
            $ref: "#/components/schemas/ExecutionStep"
        startedAt: { type: string, format: date-time }
        finishedAt: { type: [string, "null"], format: date-time }
    WorkflowExecutionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowExecution"
    Project:
      type: object
      required: [id, name, code, color, progress, tasks, owner, due, health]
      properties:
        id: { type: string }
        name: { type: string }
        code: { type: string }
        color: { type: string }
        progress: { type: integer }
        tasks: { type: string }
        owner: { type: string }
        due: { type: string }
        health: { type: string, enum: [On track, At risk, Blocked] }
    Document:
      type: object
      required: [id, name, type, size, date, status, color, objectPath]
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string }
        size: { type: string }
        date: { type: string }
        status: { type: string, enum: [Processed, Processing, Failed] }
        color: { type: string }
        objectPath: { type: [string, "null"] }
    DocumentInput:
      type: object
      required: [name, size, contentType, objectPath]
      properties:
        name: { type: string, minLength: 1 }
        size: { type: integer, minimum: 1 }
        contentType: { type: string, minLength: 1 }
        objectPath: { type: string, minLength: 1 }
    ActivityEvent:
      type: object
      required: [id, time, title, action, detail, status, color]
      properties:
        id: { type: string }
        time: { type: string }
        title: { type: string }
        action: { type: string }
        detail: { type: string }
        status: { type: string }
        color: { type: string }
    Dashboard:
      type: object
      required: [metrics, activity, projects, approval]
      properties:
        metrics:
          type: array
          items:
            $ref: "#/components/schemas/Metric"
        activity:
          type: array
          items:
            $ref: "#/components/schemas/ActivityEvent"
        projects:
          type: array
          items:
            $ref: "#/components/schemas/Project"
        approval:
          type: object
          required: [id, pending, agent, title, excerpt, draft]
          properties:
            id: { type: [string, "null"] }
            pending: { type: boolean }
            agent: { type: string }
            title: { type: string }
            excerpt: { type: string }
            draft: { type: string }
    AgentRunInput:
      type: object
      required: [prompt]
      properties:
        prompt: { type: string, minLength: 1 }
    AgentRunResponse:
      type: object
      required: [answer, activityId]
      properties:
        answer: { type: string }
        activityId: { type: string }
        runId: { type: [string, "null"] }
    PromptInput:
      type: object
      required: [prompt]
      properties:
        prompt: { type: string, minLength: 1 }
    AnalysisResponse:
      type: object
      required: [answer]
      properties:
        answer: { type: string }
    CommandToolCall:
      type: object
      required: [tool, args, summary]
      properties:
        tool: { type: string }
        args: { type: object, additionalProperties: true }
        summary: { type: string }
        documents:
          type: array
          items: { type: string }
    CommandCenterResponse:
      type: object
      required: [answer, toolCalls]
      properties:
        answer: { type: string }
        toolCalls:
          type: array
          items:
            $ref: "#/components/schemas/CommandToolCall"
    DocumentSearchInput:
      type: object
      required: [query]
      properties:
        query: { type: string, minLength: 1 }
        topK: { type: integer, minimum: 1, maximum: 20 }
    DocumentSearchHit:
      type: object
      required: [documentId, documentName, chunkIndex, content, score]
      properties:
        documentId: { type: string }
        documentName: { type: string }
        chunkIndex: { type: integer }
        content: { type: string }
        score: { type: number }
    DocumentSearchResponse:
      type: object
      required: [mode, results]
      properties:
        mode: { type: string, enum: [vector, keyword] }
        results:
          type: array
          items:
            $ref: "#/components/schemas/DocumentSearchHit"
    Approval:
      type: object
      required: [id, agent, title, excerpt, draft, status]
      properties:
        id: { type: string }
        agent: { type: string }
        title: { type: string }
        excerpt: { type: string }
        draft: { type: string }
        status: { type: string, enum: [Pending, Approved, Rejected] }
        executionId: { type: [string, "null"] }
        workflowId: { type: [string, "null"] }
        stepIndex: { type: [integer, "null"] }
    ApprovalList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Approval"
    Notification:
      type: object
      required: [id, kind, title, body, readAt, createdAt]
      properties:
        id: { type: string }
        kind: { type: string, enum: [approval_pending, approval_decision, run_completed, run_failed] }
        title: { type: string }
        body: { type: string }
        href: { type: [string, "null"] }
        readAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
    NotificationList:
      type: object
      required: [items, unreadCount]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        unreadCount: { type: integer }
    AgentRun:
      type: object
      required: [id, agentId, prompt, status, createdAt]
      properties:
        id: { type: string }
        agentId: { type: string }
        prompt: { type: string }
        answer: { type: [string, "null"] }
        status: { type: string, enum: [completed, failed] }
        latencyMs: { type: [integer, "null"] }
        inputTokens: { type: [integer, "null"] }
        outputTokens: { type: [integer, "null"] }
        createdAt: { type: string, format: date-time }
    AgentRunList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AgentRun"
    AiUsageReport:
      type: object
      required: [totals, byFeature, daily]
      properties:
        totals:
          type: object
          required: [calls, inputTokens, outputTokens]
          properties:
            calls: { type: integer }
            inputTokens: { type: integer }
            outputTokens: { type: integer }
        byFeature:
          type: array
          items:
            type: object
            required: [feature, calls, inputTokens, outputTokens]
            properties:
              feature: { type: string }
              calls: { type: integer }
              inputTokens: { type: integer }
              outputTokens: { type: integer }
        daily:
          type: array
          items:
            type: object
            required: [date, calls, inputTokens, outputTokens]
            properties:
              date: { type: string }
              calls: { type: integer }
              inputTokens: { type: integer }
              outputTokens: { type: integer }
