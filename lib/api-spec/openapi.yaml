openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: FlowMind business automation workspace API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: dashboard
  - name: agents
  - name: workflows
  - name: projects
  - name: documents
  - name: activity
  - name: approvals
  - name: settings
  - name: command
  - name: storage
  - name: auth
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get dashboard overview
      responses:
        "200":
          description: Dashboard overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /agents:
    get:
      operationId: listAgents
      tags: [agents]
      summary: List AI agents
      responses:
        "200":
          description: Agent list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Agent"
    post:
      operationId: createAgent
      tags: [agents]
      summary: Create an AI agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentInput"
      responses:
        "201":
          description: Created agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
  /agents/{id}/run:
    post:
      operationId: runAgent
      tags: [agents]
      summary: Run an AI agent with a user prompt
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentRunInput"
      responses:
        "200":
          description: Agent answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentRunResponse"
  /workflows:
    get:
      operationId: listWorkflows
      tags: [workflows]
      summary: List automation workflows
      responses:
        "200":
          description: Workflow list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Workflow"
    post:
      operationId: createWorkflow
      tags: [workflows]
      summary: Create a workflow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowInput"
      responses:
        "201":
          description: Created workflow
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
  /workflows/{id}:
    patch:
      operationId: updateWorkflow
      tags: [workflows]
      summary: Update a workflow
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowUpdate"
      responses:
        "200":
          description: Updated workflow
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
  /workflows/{id}/run:
    post:
      operationId: runWorkflow
      tags: [workflows]
      summary: Run a workflow
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Workflow execution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowExecution"
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List projects
      responses:
        "200":
          description: Project list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
  /projects/{id}/analyze:
    post:
      operationId: analyzeProject
      tags: [projects]
      summary: Generate an AI project analysis
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Project analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisResponse"
  /documents:
    get:
      operationId: listDocuments
      tags: [documents]
      summary: List documents
      responses:
        "200":
          description: Document list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Document"
    post:
      operationId: createDocument
      tags: [documents]
      summary: Save uploaded document metadata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentInput"
      responses:
        "201":
          description: Saved document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
  /documents/{id}:
    delete:
      operationId: deleteDocument
      tags: [documents]
      summary: Delete an uploaded document
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Document deleted
  /activity:
    get:
      operationId: listActivity
      tags: [activity]
      summary: List activity events
      responses:
        "200":
          description: Activity list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityEvent"
  /approvals/{id}/decision:
    patch:
      operationId: decideApproval
      tags: [approvals]
      summary: Approve or reject an AI-generated action
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalDecision"
      responses:
        "200":
          description: Updated approval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Approval"
  /settings:
    get:
      operationId: getWorkspaceSettings
      tags: [settings]
      summary: Get workspace settings
      responses:
        "200":
          description: Workspace settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceSettings"
    patch:
      operationId: updateWorkspaceSettings
      tags: [settings]
      summary: Update workspace settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceSettingsUpdate"
      responses:
        "200":
          description: Updated workspace settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceSettings"
  /command:
    post:
      operationId: runCommandCenter
      tags: [command]
      summary: Ask the AI command center a question
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromptInput"
      responses:
        "200":
          description: Command center response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisResponse"
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a private object upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Upload URL generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
  /storage/public-objects/{filePath}:
    get:
      operationId: getPublicObject
      tags: [storage]
      summary: Serve an existing public object
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Public object bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: Object not found
  /auth/user:
    get:
      operationId: getCurrentAuthUser
      tags: [auth]
      summary: Get current authentication state
      responses:
        "200":
          description: Current user or null
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserEnvelope"
  /login:
    get:
      operationId: beginBrowserLogin
      tags: [auth]
      summary: Begin browser sign-in
      parameters:
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
      responses:
        "302":
          description: Redirect to identity provider
  /callback:
    get:
      operationId: handleBrowserLoginCallback
      tags: [auth]
      summary: Complete browser sign-in
      responses:
        "302":
          description: Redirect to app
  /logout:
    get:
      operationId: logoutBrowserSession
      tags: [auth]
      summary: End browser session
      parameters:
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
      responses:
        "302":
          description: Redirect after sign-out
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
    Metric:
      type: object
      required: [label, value, change, trend]
      properties:
        label: { type: string }
        value: { type: string }
        change: { type: string }
        trend: { type: string, enum: [up, neutral, down] }
    Agent:
      type: object
      required: [id, name, type, initials, color, status, runs, description, tools]
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string }
        initials: { type: string }
        color: { type: string }
        status: { type: string, enum: [Active, Paused, Draft] }
        runs: { type: integer }
        description: { type: string }
        tools:
          type: array
          items: { type: string }
    AgentInput:
      type: object
      required: [name, type, description]
      properties:
        name: { type: string, minLength: 1 }
        type: { type: string, minLength: 1 }
        description: { type: string, minLength: 1 }
    Workflow:
      type: object
      required: [id, name, trigger, status, runs, success, lastRun, color, steps]
      properties:
        id: { type: string }
        name: { type: string }
        trigger: { type: string }
        status: { type: string, enum: [Active, Draft, Paused] }
        runs: { type: integer }
        success: { type: string }
        lastRun: { type: string }
        color: { type: string }
        steps:
          type: array
          items: { type: string }
    WorkflowInput:
      type: object
      required: [name, trigger]
      properties:
        name: { type: string, minLength: 1 }
        trigger: { type: string, minLength: 1 }
        status: { type: string, enum: [Active, Draft, Paused] }
        steps:
          type: array
          items: { type: string }
    WorkflowUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        trigger: { type: string, minLength: 1 }
        status: { type: string, enum: [Active, Draft, Paused] }
        steps:
          type: array
          items: { type: string }
    WorkflowExecution:
      type: object
      required: [id, workflowId, status, duration, steps]
      properties:
        id: { type: string }
        workflowId: { type: string }
        status: { type: string, enum: [Running, Completed, Failed, Waiting] }
        duration: { type: string }
        steps:
          type: array
          items: { type: string }
    Project:
      type: object
      required: [id, name, code, color, progress, tasks, owner, due, health]
      properties:
        id: { type: string }
        name: { type: string }
        code: { type: string }
        color: { type: string }
        progress: { type: integer }
        tasks: { type: string }
        owner: { type: string }
        due: { type: string }
        health: { type: string, enum: [On track, At risk, Blocked] }
    Document:
      type: object
      required: [id, name, type, size, date, status, color, objectPath]
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string }
        size: { type: string }
        date: { type: string }
        status: { type: string, enum: [Processed, Processing, Failed] }
        color: { type: string }
        objectPath: { type: [string, "null"] }
    DocumentInput:
      type: object
      required: [name, size, contentType, objectPath]
      properties:
        name: { type: string, minLength: 1 }
        size: { type: integer, minimum: 1 }
        contentType: { type: string, minLength: 1 }
        objectPath: { type: string, minLength: 1 }
    ActivityEvent:
      type: object
      required: [id, time, title, action, detail, status, color]
      properties:
        id: { type: string }
        time: { type: string }
        title: { type: string }
        action: { type: string }
        detail: { type: string }
        status: { type: string }
        color: { type: string }
    Dashboard:
      type: object
      required: [metrics, activity, projects, approval]
      properties:
        metrics:
          type: array
          items:
            $ref: "#/components/schemas/Metric"
        activity:
          type: array
          items:
            $ref: "#/components/schemas/ActivityEvent"
        projects:
          type: array
          items:
            $ref: "#/components/schemas/Project"
        approval:
          type: object
          required: [id, pending, agent, title, excerpt, draft]
          properties:
            id: { type: [string, "null"] }
            pending: { type: boolean }
            agent: { type: string }
            title: { type: string }
            excerpt: { type: string }
            draft: { type: string }
    AgentRunInput:
      type: object
      required: [prompt]
      properties:
        prompt: { type: string, minLength: 1 }
    AgentRunResponse:
      type: object
      required: [answer, activityId]
      properties:
        answer: { type: string }
        activityId: { type: string }
    PromptInput:
      type: object
      required: [prompt]
      properties:
        prompt: { type: string, minLength: 1 }
    AnalysisResponse:
      type: object
      required: [answer]
      properties:
        answer: { type: string }
    Approval:
      type: object
      required: [id, agent, title, excerpt, draft, status]
      properties:
        id: { type: string }
        agent: { type: string }
        title: { type: string }
        excerpt: { type: string }
        draft: { type: string }
        status: { type: string, enum: [Pending, Approved, Rejected] }
    ApprovalDecision:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [Approved, Rejected] }
        draft: { type: string }
    WorkspaceSettings:
      type: object
      required: [name, timezone, pauseBeforeExternalActions, showSourceContext, dailyDigest]
      properties:
        name: { type: string }
        timezone: { type: string }
        pauseBeforeExternalActions: { type: boolean }
        showSourceContext: { type: boolean }
        dailyDigest: { type: boolean }
    WorkspaceSettingsUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        timezone: { type: string, minLength: 1 }
        pauseBeforeExternalActions: { type: boolean }
        showSourceContext: { type: boolean }
        dailyDigest: { type: boolean }
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name: { type: string, minLength: 1 }
        size: { type: integer, minimum: 1 }
        contentType: { type: string, minLength: 1 }
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath, metadata]
      properties:
        uploadURL: { type: string, format: uri }
        objectPath: { type: string }
        metadata:
          $ref: "#/components/schemas/UploadUrlRequest"
    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id: { type: string }
        email: { type: [string, "null"], format: email }
        firstName: { type: [string, "null"] }
        lastName: { type: [string, "null"] }
        profileImageUrl: { type: [string, "null"] }
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: "#/components/schemas/AuthUser"
            - type: "null"