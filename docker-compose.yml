services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: flowmind
      POSTGRES_USER: flowmind
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flowmind_local_dev}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - flowmind-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowmind -d flowmind"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  flowmind-postgres:
