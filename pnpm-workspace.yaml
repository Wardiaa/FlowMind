minimumReleaseAge: 1440

packages:
  - artifacts/api-server
  - artifacts/flowmind
  - lib/api-client-react
  - lib/api-spec
  - lib/api-zod
  - lib/db
  - lib/auth-web
  - scripts

catalog:
  '@tailwindcss/vite': ^4.1.14
  '@tanstack/react-query': ^5.90.21
  '@types/node': ^25.3.3
  '@types/react': ^19.2.0
  '@types/react-dom': ^19.2.0
  '@vitejs/plugin-react': ^5.0.4
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  drizzle-orm: ^0.45.2
  framer-motion: ^12.23.24
  lucide-react: ^0.545.0
  react: 19.1.0
  react-dom: 19.1.0
  tailwind-merge: ^3.3.1
  tailwindcss: ^4.1.14
  tsx: ^4.21.0
  vite: ^7.3.2
  wouter: ^3.3.5
  zod: ^3.25.76

autoInstallPeers: false
strictPeerDependencies: false

onlyBuiltDependencies:
  - '@swc/core'
  - esbuild
  - msw
  - unrs-resolver

overrides:
  # argparse@2 drops the vulnerable sprintf-js dependency; mammoth's library
  # code does not use argparse at all (only its unused CLI does).
  argparse@1.0.10: 2.0.1
  brace-expansion@5.0.9: 5.0.12
  esbuild: 0.28.2
  fast-uri@3.1.7: 3.1.8
  js-yaml: 4.3.2
  postcss-selector-parser@6.0.10: 7.1.6
  proxy-addr@2.0.7: 2.0.8
  source-map-js@1.2.1: 1.2.2
